<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 14 144 144">
  <style>.eyes{display:none}@media (prefers-color-scheme: dark){.eyes{display:inline}.glasses{display:none}}</style>
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" />
    </filter>
    <clipPath id="shirt">
      <path d="M50 196 C 49 170, 50 140, 58 126 C 70 118, 130 117, 142 125 C 151 140, 152 170, 150 196 Z" />
    </clipPath>
  </defs>
  <rect x="31" y="17" width="138" height="138" rx="26" fill="#fbf7ee" stroke="#1d2540" stroke-width="5" />
  <g filter="url(#wobble)" stroke="#1d2540" stroke-linecap="round" stroke-linejoin="round">
    <!-- hands -->
    <path d="M37 151 L 51 149 L 52 163 L 38 165 Z" fill="#9a9aa2" stroke-width="3" />
    <path d="M149 149 L 163 151 L 162 165 L 148 163 Z" fill="#9a9aa2" stroke-width="3" />

    <!-- shirt -->
    <path d="M50 196 C 49 170, 50 140, 58 126 C 70 118, 130 117, 142 125 C 151 140, 152 170, 150 196 Z" fill="#24252c" stroke-width="3.5" />
    <g clip-path="url(#shirt)" stroke="#ffffff" stroke-opacity=".14" stroke-width="2">
      <path d="M40 160 L 80 120 M 40 180 L 100 120 M 50 196 L 126 120 M 70 200 L 150 120 M 92 200 L 160 132 M 116 200 L 160 156" />
    </g>
    <path d="M52 192 C 52 168, 53 142, 60 129 C 72 121, 128 120, 140 127" fill="none" stroke-width="1.2" opacity=".55" transform="translate(2 -1)" />
    <!-- collar -->
    <path d="M84 120 L 116 120 L 113 134 L 87 134 Z" fill="#3a3b44" stroke-width="3" />

    <!-- head -->
    <path d="M62 52 C 60 80, 60 104, 66 118 C 90 124, 112 124, 136 118 C 141 100, 142 76, 138 52 Z" fill="#e9c99d" stroke-width="3.5" />
    <path d="M64 56 C 62 82, 63 104, 68 116 C 92 121, 112 121, 134 116" fill="none" stroke-width="1.2" opacity=".5" transform="translate(-1.5 1)" />
    <!-- blush -->
    <ellipse cx="73" cy="99" rx="7" ry="3.5" fill="#f2a0a0" stroke="none" opacity=".65" />
    <ellipse cx="127" cy="99" rx="7" ry="3.5" fill="#f2a0a0" stroke="none" opacity=".65" />

    <!-- cap / hair -->
    <path d="M54 60 C 52 44, 58 30, 76 27 C 98 23, 122 24, 138 28 C 150 32, 150 50, 146 60 C 128 56, 112 58, 100 57 C 84 56, 70 56, 54 60 Z" fill="#1f1f24" stroke-width="3.5" />
    <path d="M70 36 C 90 31, 112 31, 132 35" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2.5" />
    <path d="M57 56 C 56 44, 62 33, 78 30 C 100 26, 124 27, 138 31" fill="none" stroke-width="1.2" opacity=".5" transform="translate(1 -2)" />

    <!-- eyes (dark mode) -->
    <g class="eyes"><path d="M71 67 Q 80 62 89 66 M 111 66 Q 120 62 129 67" fill="none" stroke-width="3" /><ellipse cx="80" cy="78" rx="5" ry="6.5" fill="#1d2540" stroke="none" /><ellipse cx="120" cy="78" rx="5" ry="6.5" fill="#1d2540" stroke="none" /></g>
    <!-- sunglasses -->
    <g class="glasses">
    <path d="M66 70 C 66 66, 92 65, 94 70 C 95 78, 93 86, 88 87 C 80 88, 70 88, 67 84 C 65 80, 65 74, 66 70 Z" fill="#15151a" stroke-width="3" />
    <path d="M106 70 C 108 65, 134 66, 134 70 C 135 76, 135 82, 132 86 C 128 88, 116 88, 111 87 C 107 85, 105 78, 106 70 Z" fill="#15151a" stroke-width="3" />
    <path d="M94 74 Q 100 70 106 74 M 66 72 L 61 69 M 134 72 L 139 69" fill="none" stroke-width="3" />
    <path d="M72 75 L 79 72 M 112 75 L 119 72" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="2.5" />

    </g>

    <!-- smile -->
    <path d="M84 100 Q 100 113 116 100" fill="none" stroke-width="3.5" />
  </g>
</svg>
