<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aquio fulgencio — software engineer</title>
    <meta name="description" content="portfolio of aquio fulgencio — software engineer building things people actually use. founder of sintachat, cto and software engineer at zxeno studio, lead developer at magbungkal mc, and computer engineering student specializing in software engineering." />
    <meta name="theme-color" content="#fbf7ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2b26" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <script>
      // set the theme before first paint so there is no flash
      (function () {
        var t = null;
        try { t = localStorage.getItem('aquio-theme'); } catch (e) {}
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
